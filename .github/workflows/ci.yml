name: CI

on:
  push:
    branches: [main, claude/**, codex/**]
  pull_request:
    branches: [main]

jobs:
  web-and-overlay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trust_assembly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trust_assembly_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test server utilities and article extraction
        run: npm run test:unit

      - name: Test clean database schema and migrations
        run: npm run test:db
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/trust_assembly_ci

      - name: Test submission and jury API workflow
        run: npm run test:api
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/trust_assembly_ci

      - name: Verify generated extension and mobile overlay files
        run: npm run check:overlay

      - name: Test shared overlay bridge
        run: npm run test:overlay

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/trust_assembly_ci
          JWT_SECRET: ci-placeholder-secret-not-real

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci --prefix apps/mobile

      - name: Type-check and test mobile app
        run: npm run check:mobile

      - name: Bundle Android app
        run: npm run export:android --prefix apps/mobile

  ios-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build shared Safari extension files
        run: npm run build:overlay

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Compile unsigned simulator app and extensions
        run: >-
          xcodebuild
          -project ios/TrustAssembly.xcodeproj
          -scheme TrustAssembly
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
